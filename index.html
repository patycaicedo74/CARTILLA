<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Cartilla digital interactiva sobre el uso pedagógico de las TIC y las actividades rectoras en la educación inicial: juego, arte, literatura, exploración del medio e inclusión." />
  <meta name="theme-color" content="#6c8cff" />
  <title>Cartilla Digital Interactiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ====================== BARRA SUPERIOR / NAVEGACIÓN ====================== -->
  <header class="topbar" role="banner">
    <a class="brand" href="#portada" data-nav="inicio" aria-label="Ir al inicio de la cartilla">
      <span class="brand__logo" aria-hidden="true">🌈</span>
      <span class="brand__name">Cartilla Digital Interactiva</span>
    </a>

    <nav class="nav" aria-label="Navegación principal de la cartilla">
      <button class="nav__btn" type="button" data-nav="inicio" aria-label="Ir al inicio">
        <span aria-hidden="true">🏠</span> Inicio
      </button>
      <button class="nav__btn" type="button" data-nav="indice" aria-label="Ir al índice">
        <span aria-hidden="true">📑</span> Índice
      </button>
      <button class="nav__btn" type="button" data-nav="prev" aria-label="Página anterior">
        <span aria-hidden="true">⬅️</span> Anterior
      </button>
      <button class="nav__btn nav__btn--primary" type="button" data-nav="next" aria-label="Página siguiente">
        Siguiente <span aria-hidden="true">➡️</span>
      </button>
    </nav>
  </header>

  <!-- Barra de progreso de lectura -->
  <div class="progress" aria-hidden="true"><div class="progress__bar" id="progressBar"></div></div>

  <!-- ====================== CONTENIDO PRINCIPAL ====================== -->
  <main id="app" class="app" role="main" tabindex="-1" aria-live="polite">
    <!-- Las páginas se generan dinámicamente desde data/contenido.json -->
  </main>

  <!-- Indicador de página + navegación inferior -->
  <div class="pager" role="navigation" aria-label="Navegación entre páginas">
    <button class="pager__btn" type="button" data-nav="prev" aria-label="Página anterior">⬅️ Anterior</button>
    <span class="pager__count" id="pagerCount" aria-live="polite"></span>
    <button class="pager__btn" type="button" data-nav="next" aria-label="Página siguiente">Siguiente ➡️</button>
  </div>

  <!-- ====================== PIE DE PÁGINA ====================== -->
  <footer class="footer" role="contentinfo">
    <p>Cartilla Digital Interactiva · Educación inicial · TIC, juego, arte, literatura, exploración del medio e inclusión.</p>
    <p class="footer__small">Hecha para abrirse desde cualquier dispositivo. Usa el índice o las flechas para navegar.</p>
  </footer>

  <!-- ====================== MODAL REUTILIZABLE ====================== -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" hidden>
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__dialog" role="document">
      <button class="modal__close" type="button" data-close-modal aria-label="Cerrar">✕</button>
      <h2 class="modal__title" id="modalTitle"></h2>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
